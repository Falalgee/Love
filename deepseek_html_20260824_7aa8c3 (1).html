<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Heart of I Love You – Enhanced</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            cursor: pointer; /* indicate clickable */
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            // Heart formula vertical shift (same as Python version)
            const Y_CENTER = 2.54;

            // Precompute all heart points (x, y) in heart coordinate system (y up)
            const heartPoints = [];
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

            for (let scale = 11; scale <= 17; scale++) {
                for (let i = 0; i <= 120; i++) {
                    const angleDeg = 3 * i;
                    const angleRad = angleDeg * Math.PI / 180;
                    const hx = scale * 16 * Math.pow(Math.sin(angleRad), 3);
                    const hy = scale * (
                        13 * Math.cos(angleRad)
                        - 5 * Math.cos(2 * angleRad)
                        - 2 * Math.cos(3 * angleRad)
                        - Math.cos(4 * angleRad)
                        + Y_CENTER
                    );
                    heartPoints.push({ hx, hy });
                    if (hx < minX) minX = hx;
                    if (hx > maxX) maxX = hx;
                    if (hy < minY) minY = hy;
                    if (hy > maxY) maxY = hy;
                }
            }

            const totalPoints = heartPoints.length; // 847
            const heartCenterX = (minX + maxX) / 2;
            const heartCenterY = (minY + maxY) / 2;

            // Transformation variables (updated on resize)
            let scaleFactor, offsetX, offsetY;
            let smallFontSize, titiFontSize;
            let centerScreenX, centerScreenY;

            // Animation state
            let heartStartTime = performance.now();
            let titiStartTime = null;
            let pulseStartTime = null;
            const heartDuration = 15000;  // 15 seconds for slow heart formation
            const titiDuration = 1500;    // 1.5 seconds for Titi pop-in
            const fadeInDuration = 500;   // 0.5 sec per text fade-in

            // Birth times for each heart point (for fade-in)
            let birthTimes = new Array(totalPoints).fill(-1);

            // Easing function for Titi appearance
            function easeOutBack(t) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const displayWidth = window.innerWidth;
                const displayHeight = window.innerHeight;

                canvas.width = displayWidth * dpr;
                canvas.height = displayHeight * dpr;
                canvas.style.width = displayWidth + 'px';
                canvas.style.height = displayHeight + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                // Compute transformation to fit heart with padding
                const padding = 20;
                const availableWidth = displayWidth - 2 * padding;
                const availableHeight = displayHeight - 2 * padding;
                const heartWidth = maxX - minX;
                const heartHeight = maxY - minY;
                scaleFactor = Math.min(availableWidth / heartWidth, availableHeight / heartHeight);

                // Centering offsets (so heart center is at canvas center)
                offsetX = displayWidth / 2 - heartCenterX * scaleFactor;
                offsetY = displayHeight / 2 + heartCenterY * scaleFactor;

                // Screen coordinates of the heart center
                centerScreenX = displayWidth / 2;
                centerScreenY = displayHeight / 2;

                // Font sizes relative to canvas dimensions
                const baseSize = Math.min(displayWidth, displayHeight);
                smallFontSize = Math.max(8, Math.min(14, baseSize / 40));
                titiFontSize = Math.max(30, baseSize * 0.1);

                // Reset animation on resize
                restartAnimation();
            }

            function restartAnimation() {
                heartStartTime = performance.now();
                titiStartTime = null;
                pulseStartTime = null;
                birthTimes = new Array(totalPoints).fill(-1);
            }

            function drawHeartFrame(now) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Determine current pulse scale (only after Titi fully appears)
                let pulseScale = 1.0;
                if (pulseStartTime !== null) {
                    const pulsePhase = (now - pulseStartTime) / 800; // one beat every 0.8 sec
                    pulseScale = 1 + 0.02 * Math.sin(pulsePhase * Math.PI * 2);
                }

                // Determine how many heart points to draw
                let drawnCount;
                if (titiStartTime === null) {
                    const heartProgress = Math.min(1, (now - heartStartTime) / heartDuration);
                    drawnCount = Math.floor(heartProgress * totalPoints);
                } else {
                    drawnCount = totalPoints; // heart fully drawn
                }

                // Draw "I love you" texts with smooth fade-in
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffb6c1';
                ctx.font = `bold ${smallFontSize}px Arial, sans-serif`;

                for (let idx = 0; idx < drawnCount; idx++) {
                    // Set birth time when point first appears
                    if (birthTimes[idx] === -1) {
                        birthTimes[idx] = now;
                    }
                    // Compute fade-in alpha
                    const age = now - birthTimes[idx];
                    const alpha = Math.min(1, age / fadeInDuration);
                    if (alpha <= 0) continue;

                    ctx.globalAlpha = alpha;

                    // Apply pulse scale around the heart center
                    const p = heartPoints[idx];
                    const sx = (p.hx - heartCenterX) * scaleFactor * pulseScale + centerScreenX;
                    const sy = -(p.hy - heartCenterY) * scaleFactor * pulseScale + centerScreenY;

                    ctx.fillText('I love you', sx, sy);
                }
                ctx.globalAlpha = 1;

                // After heart is complete, show Titi
                if (drawnCount >= totalPoints) {
                    if (titiStartTime === null) {
                        titiStartTime = now;
                    }
                    const titiProgress = Math.min(1, (now - titiStartTime) / titiDuration);
                    const eased = easeOutBack(titiProgress);

                    // Set Titi font size with pulse scaling (after it appears)
                    const titiCurrentSize = titiFontSize * eased * pulseScale;

                    // Animated glow
                    let shadowBlur = 20;
                    if (pulseStartTime !== null) {
                        const glowPhase = (now - pulseStartTime) / 800;
                        shadowBlur = 20 + 10 * Math.sin(glowPhase * Math.PI * 2);
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.min(1, titiProgress * 2);
                    ctx.fillStyle = '#ffb6c1';
                    ctx.font = `bold ${titiCurrentSize}px Georgia, "Times New Roman", serif`;
                    ctx.shadowColor = '#ffb6c1';
                    ctx.shadowBlur = shadowBlur;
                    ctx.fillText('Titi', centerScreenX, centerScreenY);
                    ctx.restore();

                    // Start heartbeat pulse after Titi fully appears
                    if (titiProgress >= 1 && pulseStartTime === null) {
                        pulseStartTime = now;
                    }
                }

                requestAnimationFrame(drawHeartFrame);
            }

            // Click or tap to replay
            function handleReplay(e) {
                e.preventDefault();
                restartAnimation();
            }
            canvas.addEventListener('click', handleReplay);
            canvas.addEventListener('touchstart', handleReplay, { passive: false });

            // Initial setup
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Start animation
            requestAnimationFrame(drawHeartFrame);
        })();
    </script>
</body>
</html>
